name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Build and test
        run: ./gradlew build --no-daemon

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Vite 8 and Vitest 5 need Node 22.12 or newer; 26 is the LTS line and resolves to the latest 26.x.
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=low

  # The captures themselves never run in CI: they need a stack and a browser. This installs the pinned dependencies, checks that the scripts parse and audits the dependencies.
  showcase:
    name: showcase scripts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e/showcase
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci
      - name: Check script syntax
        run: npm run check
      - name: Audit dependencies
        run: npm audit --audit-level=low
