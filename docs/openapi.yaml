openapi: 3.1.0
info:
  title: Code Quests API
  description: API for submitting programming ideas and voting on them.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 0.0.1-SNAPSHOT
servers:
- url: http://localhost:8080
  description: Local development API (dev profile)
tags:
- name: Ideas
  description: Submit quests for the realm and cast votes on them.
paths:
  /api/ideas/{id}/vote:
    put:
      tags:
      - Ideas
      summary: Cast a vote
      description: "Sets the caller's vote to 1 or -1. Voting the same value again\
        \ changes nothing, and the opposite value switches the vote."
      operationId: vote
      parameters:
      - name: id
        in: path
        description: Idea identifier.
        required: true
        schema:
          type: integer
          format: int64
        example: 42
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteRequest"
        required: true
      responses:
        "200":
          description: The idea with its updated score and the caller's vote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdeaResponse"
        "400":
          description: "The id is not a number, the body is malformed, or the value\
            \ is not 1 or -1."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: No idea has that id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: A lock or transaction collision. The request may be retried.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "415":
          description: The Content-Type is not application/json.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          description: Too many votes from this address. Retry-After says how long
            to rest.
          headers:
            Retry-After:
              description: Whole seconds to wait before the next attempt.
              style: simple
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          description: An unexpected failure. The body carries a request id in instance
            and no internal detail.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    delete:
      tags:
      - Ideas
      summary: Withdraw a vote
      description: Removes the caller's vote. It changes nothing when the caller has
        not voted.
      operationId: removeVote
      parameters:
      - name: id
        in: path
        description: Idea identifier.
        required: true
        schema:
          type: integer
          format: int64
        example: 42
      responses:
        "200":
          description: The idea with its updated score and myVote of 0.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdeaResponse"
        "400":
          description: The id is not a number.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: No idea has that id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: A lock or transaction collision. The request may be retried.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          description: Too many votes from this address. Retry-After says how long
            to rest.
          headers:
            Retry-After:
              description: Whole seconds to wait before the next attempt.
              style: simple
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          description: An unexpected failure. The body carries a request id in instance
            and no internal detail.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/ideas:
    get:
      tags:
      - Ideas
      summary: List ideas
      description: Returns one page of ideas. Each item carries the caller's own vote
        in myVote.
      operationId: list
      parameters:
      - name: page
        in: query
        description: Zero-based page number.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
        example: 0
      - name: size
        in: query
        description: "Page size, from 1 to 50."
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 50
          minimum: 1
        example: 20
      - name: sort
        in: query
        description: "Ordering: newest, oldest or top. The value is case-insensitive."
        required: false
        schema:
          type: string
          default: newest
          enum:
          - newest
          - oldest
          - top
        example: top
      responses:
        "200":
          description: "A page of ideas, possibly empty."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdeaPageResponse"
        "400":
          description: A paging or sort parameter is out of range.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          description: An unexpected failure. The body carries a request id in instance
            and no internal detail.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    post:
      tags:
      - Ideas
      summary: Submit an idea
      description: Adds an idea to the board with a score of zero. Any score or date
        in the body is ignored.
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIdeaRequest"
        required: true
      responses:
        "201":
          description: The idea was created. The Location header points at it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdeaResponse"
        "400":
          description: The body is malformed or a field is not valid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: A lock or transaction collision raised by the database. The
            request may be retried.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "415":
          description: The Content-Type is not application/json.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          description: Too many ideas from this address. Retry-After says how long
            to rest.
          headers:
            Retry-After:
              description: Whole seconds to wait before the next attempt.
              style: simple
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          description: An unexpected failure. The body carries a request id in instance
            and no internal detail.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/ideas/{id}:
    get:
      tags:
      - Ideas
      summary: Get an idea
      description: Returns one idea with the caller's own vote.
      operationId: get
      parameters:
      - name: id
        in: path
        description: Idea identifier.
        required: true
        schema:
          type: integer
          format: int64
        example: 42
      responses:
        "200":
          description: The idea.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdeaResponse"
        "400":
          description: The id is not a number.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: No idea has that id. The lost quest is not on the board.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          description: An unexpected failure. The body carries a request id in instance
            and no internal detail.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
components:
  schemas:
    VoteRequest:
      type: object
      description: A vote on an idea.
      properties:
        value:
          type: integer
          format: int32
          description: "1 to upvote, -1 to downvote."
          enum:
          - -1
          - 1
          example: 1
      required:
      - value
    ProblemDetail:
      type: object
      description: An RFC 9457 problem. Every error response has this shape.
      properties:
        type:
          type: string
          format: uri
          description: "Problem type URI. Left out of the body while it is the default\
            \ about:blank, which is the case for every response."
        title:
          type: string
          description: The HTTP reason phrase.
        status:
          type: integer
          format: int32
          description: The HTTP status code.
        detail:
          type: string
          description: Fixed text for the error code. It never carries request input.
        instance:
          type: string
          format: uri
          description: "urn:request-id: followed by the request id, which matches\
            \ the log line."
        code:
          type: string
          description: Stable machine-readable error code.
          enum:
          - VALIDATION_FAILED
          - MALFORMED_REQUEST
          - IDEA_NOT_FOUND
          - RESOURCE_NOT_FOUND
          - METHOD_NOT_ALLOWED
          - UNSUPPORTED_MEDIA_TYPE
          - NOT_ACCEPTABLE
          - CONFLICT
          - RATE_LIMITED
          - REQUEST_FAILED
          - INTERNAL_ERROR
        errors:
          type: array
          description: The failed fields. Present only on validation errors.
          items:
            type: object
            properties:
              field:
                type: string
                description: Name of the parameter or body field.
              message:
                type: string
                description: Fixed text that says what is wrong. It never repeats
                  the value.
            required:
            - field
            - message
        retryAfterSeconds:
          type: integer
          format: int64
          description: "Whole seconds to wait. Present only on 429, and equal to the\
            \ Retry-After header."
      required:
      - code
      - status
    IdeaResponse:
      type: object
      description: An idea on the board.
      properties:
        id:
          type: integer
          format: int64
          description: Idea identifier.
          example: 42
        author:
          type:
          - string
          - "null"
          description: "Author name, null when the idea is anonymous."
          example: Ada the Bold
        description:
          type: string
          description: The quest itself.
          example: Forge a CLI that slays merge conflicts before they reach the main
            branch.
        createdAt:
          type: string
          format: date-time
          description: "Creation instant in ISO-8601, UTC."
          example: 2026-11-04T18:30:00.123456Z
        score:
          type: integer
          format: int32
          description: Sum of all votes on the idea.
          example: 17
        myVote:
          type: integer
          format: int32
          description: "The caller's own vote: 1, -1, or 0 when the caller has not\
            \ voted."
          enum:
          - -1
          - 0
          - 1
          example: 1
    CreateIdeaRequest:
      type: object
      description: A new idea to put on the board.
      properties:
        author:
          type:
          - string
          - "null"
          description: Who is behind the idea. Leave it out to stay anonymous.
          example: Ada the Bold
          maxLength: 60
          minLength: 0
        description:
          type: string
          description: The quest itself.
          example: Forge a CLI that slays merge conflicts before they reach the main
            branch.
          maxLength: 1000
          minLength: 10
      required:
      - description
    IdeaPageResponse:
      type: object
      description: One page of ideas.
      properties:
        items:
          type: array
          description: Ideas on this page.
          items:
            $ref: "#/components/schemas/IdeaResponse"
        page:
          type: integer
          format: int32
          description: Zero-based page number.
          example: 0
        size:
          type: integer
          format: int32
          description: Requested page size.
          example: 20
        totalItems:
          type: integer
          format: int64
          description: Number of ideas on all pages.
          example: 137
        totalPages:
          type: integer
          format: int32
          description: Number of pages.
          example: 7
