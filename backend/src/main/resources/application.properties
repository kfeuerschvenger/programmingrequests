spring.application.name=code-quests

# Datasource: the password has no default on purpose.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Voter identity: the HMAC secret has no default on purpose. VoterProperties rejects a missing or short value at startup.
app.voter.hash-secret=${VOTER_HASH_SECRET:}

# Rate limits per client: at most capacity calls per window. State is in memory, so a limit applies per instance.
app.rate-limit.create.capacity=${RATE_LIMIT_CREATE_CAPACITY:5}
app.rate-limit.create.window=${RATE_LIMIT_CREATE_WINDOW:10m}
app.rate-limit.vote.capacity=${RATE_LIMIT_VOTE_CAPACITY:30}
app.rate-limit.vote.window=${RATE_LIMIT_VOTE_WINDOW:1m}
app.rate-limit.max-tracked-clients=${RATE_LIMIT_MAX_TRACKED_CLIENTS:10000}

# CORS is off by default: the frontend is same-origin. A comma-separated list enables it for exactly those origins.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Virtual threads make the Hikari pool the real concurrency limit for database work.
spring.threads.virtual.enabled=true
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1740000}

# JPA: Flyway owns the schema, Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Statements slower than this threshold are logged by the org.hibernate.SQL_SLOW logger.
spring.jpa.properties.hibernate.log_slow_query=${DB_SLOW_QUERY_THRESHOLD_MS:500}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator: only health and info, under /manage.
spring.jmx.enabled=false
management.endpoints.web.base-path=/manage
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=code-quests
info.app.description=Code Quests API

# OpenAPI: off by default, the dev profile turns it on.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha

# Request limits and Tomcat hardening.
server.port=${SERVER_PORT:8080}
server.max-http-request-header-size=${MAX_HTTP_REQUEST_HEADER_SIZE:16KB}
server.tomcat.max-http-form-post-size=${MAX_HTTP_FORM_POST_SIZE:64KB}
server.tomcat.max-swallow-size=${MAX_SWALLOW_SIZE:64KB}
server.tomcat.max-connections=${SERVER_TOMCAT_MAX_CONNECTIONS:1000}
server.tomcat.accept-count=${SERVER_TOMCAT_ACCEPT_COUNT:100}
server.tomcat.connection-timeout=${SERVER_TOMCAT_CONNECTION_TIMEOUT:10s}
server.tomcat.relaxed-query-chars=
server.tomcat.relaxed-path-chars=

# Client address: the API runs behind nginx. Tomcat's remote IP valve replaces the remote address with X-Forwarded-For only when the connection comes from a trusted proxy.
# TRUSTED_PROXIES is a regular expression matched against the connecting address; the default is Tomcat's private-range pattern, which covers the nginx container on the Docker network.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXIES:10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|169\\.254\\.\\d{1,3}\\.\\d{1,3}|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(?:1[6-9]|2\\d|3[0-1])\\.\\d{1,3}\\.\\d{1,3}|0:0:0:0:0:0:0:1|::1}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.shutdown=graceful
spring.mvc.async.request-timeout=${MVC_ASYNC_REQUEST_TIMEOUT_MS:30000}
spring.servlet.multipart.enabled=false
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Logging: console only, the pattern lives in logback-spring.xml.
logging.charset.console=UTF-8
logging.level.org.hibernate.SQL_SLOW=INFO
