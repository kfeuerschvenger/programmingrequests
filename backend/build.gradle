plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.feuerschvenger'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

// Boot 4.1.2 pins Jackson 3.1.7 and 2.21.7 (the 2.x line arrives through springdoc). CVE-2026-110879 (jackson-databind RCE, fixed in 2.21.8 and 3.1.8) was verified against these versions.
// Drop these overrides when Boot manages a newer version.
ext['jackson-bom.version'] = '3.1.8'
ext['jackson-2-bom.version'] = '2.21.8'
// Boot 4.1.2 pins logback 1.5.38. CVE-2026-19880 (path traversal through MDCBasedDiscriminator/SiftingAppender, fixed in 1.6.3, no 1.5.x fix) was verified.
// This app does not use SiftingAppender, but the pin keeps dependency scanners clean. Drop it when Boot manages 1.6.3 or newer.
ext['logback.version'] = '1.6.6'

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-mysql'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
	implementation 'com.bucket4j:bucket4j_jdk17-core:8.22.0'
	implementation 'com.github.ben-manes.caffeine:caffeine'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'

	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Exposes META-INF/build-info.properties so the OpenAPI document reports the project version.
springBoot {
	buildInfo()
}

// One executable archive with a fixed name, so the Dockerfile does not depend on the version.
tasks.named('jar') {
	enabled = false
}

tasks.named('bootJar') {
	archiveFileName = 'app.jar'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
}

jacocoTestReport {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
}
