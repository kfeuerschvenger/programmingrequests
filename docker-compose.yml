services:
  db:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - code_quests_db:/var/lib/mysql
    networks:
      - prnetwork
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: always
    environment:
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      # Required: the API refuses to start without a secret of at least 32 bytes.
      VOTER_HASH_SECRET: ${VOTER_HASH_SECRET}
      # Optional: a key without a value is passed through only when it is set in the environment or the env file.
      TRUSTED_PROXIES:
    ports:
      # Loopback only: the API trusts X-Forwarded-For from private addresses, so it must be reached through nginx.
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - prnetwork
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/manage/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    build: ./frontend
    restart: always
    expose:
      - "80"
    depends_on:
      - api
    networks:
      - prnetwork

volumes:
  code_quests_db:

networks:
  prnetwork:
    name: prnetwork
    driver: bridge
